<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14171A" />
    <title>Character Sheet (sample)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@400;600;700&family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=JetBrains+Mono:wght@400;700&display=swap"
    />
    <script>
      // Sample mode never talks to a backend: every Supabase request fails
      // before it leaves the page, so nothing is read from or written to it.
      (function () {
        var real = window.fetch.bind(window);
        window.fetch = function (input, init) {
          var url = typeof input === 'string' ? input : (input && input.url) || '';
          if (/supabase\.(co|in)|\/rest\/v1\/|\/auth\/v1\/|\/storage\/v1\//.test(url)) {
            return Promise.reject(new TypeError('sample mode: backend disabled'));
          }
          return real(input, init);
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/sample.tsx"></script>
  </body>
</html>
